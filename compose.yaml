# Every service lists the variables it reads under environment: as bare
# passthrough keys (`KEY:`). Compose resolves them from the shell, then .env;
# an unset key stays absent in the container, which the portal and provisioner
# treat differently from "set but empty" -- so never write ${KEY:-} for them.
# No service uses env_file:. Pinned by portal/tests/test_compose_env_scoping.py.
#
# Single source for the tunnel network name: aliased below into both the
# portal's own environment: (services.portal) and networks.shadowsocks.name,
# so the two can't drift apart the way two independently-typed
# ${SHADOWSOCKS_NETWORK:-shadowsocks} literals could (see
# docs/development/architecture.md).
x-shadowsocks-network: &shadowsocks_network ${SHADOWSOCKS_NETWORK:-shadowsocks}

services:
  nginx:
    build:
      context: ./nginx
      args:
        GIT_REVISION: ${GIT_REVISION:-}
      # Refresh the base image: a cached one keeps a stale CA bundle and toolchain (#254).
      pull: true
    image: local/nginx
    container_name: nginx
    environment:
      # Required: the entrypoint renders nginx/etc/*.tmpl with ${DOMAIN} at startup.
      # Unset/empty value -> nginx refuses to start. See nginx/nginx-entrypoint.sh.
      DOMAIN: ${DOMAIN:-postern.example.com}
      # Real client IP behind a TLS-passthrough gateway (issue #98). Empty ->
      # direct-listen, no PROXY protocol (browsers connect to nginx directly).
      # compose.gateway.yaml sets a working default automatically.
      PROXY_PROTOCOL_FROM: ${PROXY_PROTOCOL_FROM:-}
      # Edge fronting (issue #155). "none" (default) -> render.sh emits no
      # edge config; the RO postern-edge mount below stays empty. "cloudflare"/
      # "generic" activate real-IP restoration. render.sh reads these raw --
      # pydantic Settings do not gate this container.
      EDGE_PROFILE: ${EDGE_PROFILE:-none}
      # Cloudflare Authenticated Origin Pull mTLS; only meaningful under
      # EDGE_PROFILE=cloudflare. render.sh FAILs LOUD on an unrecognized value.
      EDGE_CF_AUTHENTICATED_ORIGIN_PULL: ${EDGE_CF_AUTHENTICATED_ORIGIN_PULL:-true}
      # EDGE_PROFILE=generic only: the CIDRs trusted as the real-IP source and
      # the header that carries the client IP. render.sh reads both raw.
      EDGE_TRUSTED_CIDRS:
      EDGE_REALIP_HEADER:
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      # The nginx image's /etc/nginx is writable; entrypoint renders templates
      # from /etc/nginx/templates/ into /etc/nginx/ at startup. No bind mount
      # of nginx/etc/ is needed -- the source tree is baked into the image at
      # build time. /etc/letsencrypt and /var/log/nginx still bind through.
      - type: bind
        read_only: true
        source: /etc/localtime
        target: /etc/localtime
      - type: bind
        source: /etc/letsencrypt
        target: /etc/letsencrypt
      - type: bind
        source: ./nginx/log
        target: /var/log/nginx
      # CF edge IP-range allowlists written by the provisioner (rw sole-writer);
      # nginx reads RO. render.sh globs /var/lib/postern-edge/*.conf into both
      # :443 server blocks. Empty when EDGE_PROFILE=none.
      - postern-edge:/var/lib/postern-edge:ro
    networks: [default, shadowsocks]
    init: true
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
      args:
        GIT_REVISION: ${GIT_REVISION:-}
      pull: true
    image: local/postern-portal
    container_name: portal
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
      # Aliased to the same node as networks.shadowsocks.name below -- see
      # the x-shadowsocks-network comment at the top of this file.
      SHADOWSOCKS_NETWORK: *shadowsocks_network
      # Required, as before: the portal refuses to start without it, and so does
      # any `docker compose` command run without a usable .env.
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      # The rest of postern.settings.Settings, in its order. Nothing here is a
      # DNS provider credential: those go to the provisioner only.
      DATABASE_PATH:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_USER:
      SMTP_PASSWORD:
      SMTP_FROM:
      OTP_EXPIRY_SECONDS:
      OTP_MAX_ATTEMPTS:
      OTP_MAX_REQUESTS_PER_WINDOW:
      OTP_RATE_WINDOW_SECONDS:
      SESSION_EXPIRY_DAYS:
      RECONCILE_INTERVAL_SECONDS:
      SHADOWSOCKS_IMAGE:
      INSTANCE_ID:
      DOMAIN:
      PRODUCT_NAME:
      PRODUCT_ICON_PATH:
      GEOIP_DB_DIR:
      MTA_VERIFY_DNS:
      MTA_REQUIRE_DNSSEC:
      MTA_DKIM_SELECTOR_PREFIX:
      MTA_ADMIN_EMAIL:
      MTA_DKIM_ROTATION_DAYS:
      DNS_PROVIDER:
      CERT_RENEWAL:
      CERT_ACME_EMAIL:
      CERT_ACME_DIRECTORY:
      CERT_RENEWAL_DAYS_BEFORE_EXPIRY:
      CERT_FORCE_REISSUE:
      EDGE_PROFILE:
      EDGE_TRUSTED_CIDRS:
      EDGE_REALIP_HEADER:
      EDGE_CF_AUTHENTICATED_ORIGIN_PULL:
      EDGE_CF_MANAGE_ZONE_ECH:
      EDGE_CF_MANAGE_SSL_MODE:
      EDGE_CF_SSL_MODE:
      ECH_DOH_URL:
      PUBLIC_IPV4:
      PUBLIC_IPV6:
    volumes:
      - postern-data:/data
      # rw so `postern mta show-dns` can read state.json + selector pubkeys, AND
      # `postern mta rotate-dkim` can write the .rotate-dkim trigger. The portal
      # is trusted not to corrupt state.json -- only the provisioner writes it
      # (see rotation.write_state docstring).
      - postern-mta-data:/var/lib/opendkim
      # Optional: custom brand icon for the portal header (SVG preferred, PNG accepted;
      # <= 256 KB). Uncomment AND set PRODUCT_ICON_PATH=/brand/icon.svg in .env.
      # See docs/deployment/customization.md.
      # - type: bind
      #   source: /var/lib/postern/brand.svg
      #   target: /brand/icon.svg
      #   read_only: true
      # Optional: GeoLite2 MMDB directory for the login-page identity card enrichment.
      # Uncomment AND set GEOIP_DB_DIR=/geoip in .env. The portal hot-reloads on mtime
      # change so monthly DB rotations need no portal restart. See docs/deployment/customization.md.
      # - type: bind
      #   source: /var/lib/postern/geoip
      #   target: /geoip
      #   read_only: true
    networks: [default, mta-submit]
    depends_on:
      docker-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
    restart: unless-stopped
    stop_grace_period: 30s  # gives wait_for_inflight_reconcile + cleanup_all_containers room to run

  mta:
    build:
      context: .
      dockerfile: mta/Dockerfile
      args:
        GIT_REVISION: ${GIT_REVISION:-}
      pull: true
    image: local/postern-mta
    container_name: mta
    profiles: [with-mta]
    hostname: mail.${DOMAIN:-postern.example.com}
    environment:
      MTA_SUBMIT_CIDR: 172.30.42.0/29
      # Everything else mta/entrypoint.py reads. The mta is on public port 25 and
      # receives no credentials.
      DOMAIN:
      MTA_VERIFY_DNS:
      MTA_REQUIRE_DNSSEC:
      MTA_ADMIN_EMAIL:
      SMTP_FROM:
      MTA_DKIM_SELECTOR_PREFIX:
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE, SYS_CHROOT]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "25:25/tcp"
    volumes:
      - postern-mta-data:/var/lib/opendkim
      - postern-mta-queue:/var/spool/postfix
      - type: bind
        read_only: true
        source: /etc/letsencrypt
        target: /etc/letsencrypt
    networks:
      # `default:` (null) attaches with defaults, matching the existing
      # e2e-mta.compose.yaml form so the two files stay shape-identical.
      default:
      # The bare `mta`/`postern-mta` service name is multi-homed (default +
      # mta-submit) and Docker DNS resolves it to the *default*-network IP
      # (issue #151), which is outside Postfix mynetworks (172.30.42.0/29) ->
      # submission rejected. This alias makes SMTP_HOST=mta-submit resolve to the
      # internal IP so the portal's source is in mynetworks. Keep in sync with
      # SMTP_HOST in example.env.
      mta-submit:
        aliases: [mta-submit]
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('127.0.0.1',25),3); s.close(); s=socket.create_connection(('127.0.0.1',587),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
    init: true
    restart: unless-stopped

  provisioner:
    build:
      context: .
      dockerfile: provisioner/Dockerfile
      args:
        GIT_REVISION: ${GIT_REVISION:-}
      pull: true
    image: local/postern-provisioner
    container_name: provisioner
    # Multiple profiles -- a service starts when ANY listed profile is active.
    # with-cert-renewal lets cert auto-renewal run even without MTA.
    profiles: [with-mta, with-cert-renewal, with-edge]
    user: "110:110"
    environment:
      # "MTA deployed" signal for the enable-gate (entrypoint + healthcheck):
      # the built-in MTA runs under the with-mta profile, but a Cloudflare edge
      # deployment also sets DNS_PROVIDER=cloudflare without deploying the MTA.
      # Inject the RESOLVED profile set (compose reads shell OR .env) so the
      # provisioner can tell "with-mta" apart from "DNS provider configured" and
      # never publishes mail/mta-sts records for an edge-only deployment.
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      # Everything else the entrypoint, healthcheck and lego driver read.
      DOMAIN:
      MTA_DKIM_ROTATION_DAYS:
      MTA_DKIM_SELECTOR_PREFIX:
      MTA_ADMIN_EMAIL:
      DNS_PROVIDER:
      CERT_RENEWAL:
      CERT_ACME_EMAIL:
      CERT_ACME_DIRECTORY:
      CERT_RENEWAL_DAYS_BEFORE_EXPIRY:
      CERT_FORCE_REISSUE:
      PUBLIC_IPV4:
      PUBLIC_IPV6:
      EDGE_PROFILE:
      EDGE_CF_MANAGE_ZONE_ECH:
      EDGE_CF_MANAGE_SSL_MODE:
      EDGE_CF_SSL_MODE:
      # DNS provider variables: the only place they enter the stack. Per provider,
      # what provisioner/postern-dns/main.go newProvider reads plus the variables
      # lego documents for it (lego runs with this whole environment). Static
      # credentials only: route53's profile/credentials-file variables are left out
      # (no ~/.aws in this container). Adding a provider means adding its variables
      # here; pinned by test_compose_env_scoping.py, which also pins the lego version.
      # cloudflare
      CLOUDFLARE_API_TOKEN:
      CF_API_EMAIL:
      CF_API_KEY:
      CF_DNS_API_TOKEN:
      CF_ZONE_API_TOKEN:
      CLOUDFLARE_EMAIL:
      CLOUDFLARE_API_KEY:
      CLOUDFLARE_DNS_API_TOKEN:
      CLOUDFLARE_ZONE_API_TOKEN:
      CLOUDFLARE_BASE_URL:
      CLOUDFLARE_POLLING_INTERVAL:
      CLOUDFLARE_PROPAGATION_TIMEOUT:
      CLOUDFLARE_TTL:
      CLOUDFLARE_HTTP_TIMEOUT:
      # route53
      AWS_REGION:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      AWS_HOSTED_ZONE_ID:
      AWS_ASSUME_ROLE_ARN:
      AWS_EXTERNAL_ID:
      AWS_WAIT_FOR_RECORD_SETS_CHANGED:
      AWS_PRIVATE_ZONE:
      AWS_MAX_RETRIES:
      AWS_POLLING_INTERVAL:
      AWS_PROPAGATION_TIMEOUT:
      AWS_TTL:
      # gandi
      GANDI_API_TOKEN:
      GANDIV5_PERSONAL_ACCESS_TOKEN:
      GANDIV5_API_KEY:
      GANDIV5_POLLING_INTERVAL:
      GANDIV5_PROPAGATION_TIMEOUT:
      GANDIV5_TTL:
      GANDIV5_HTTP_TIMEOUT:
      # digitalocean
      DO_AUTH_TOKEN:
      DO_API_URL:
      DO_POLLING_INTERVAL:
      DO_PROPAGATION_TIMEOUT:
      DO_TTL:
      DO_HTTP_TIMEOUT:
      # ovh
      OVH_ENDPOINT:
      OVH_APPLICATION_KEY:
      OVH_APPLICATION_SECRET:
      OVH_CONSUMER_KEY:
      OVH_CLIENT_ID:
      OVH_CLIENT_SECRET:
      OVH_ACCESS_TOKEN:
      OVH_POLLING_INTERVAL:
      OVH_PROPAGATION_TIMEOUT:
      OVH_TTL:
      OVH_HTTP_TIMEOUT:
      # hetzner
      HETZNER_API_TOKEN:
      HETZNER_POLLING_INTERVAL:
      HETZNER_PROPAGATION_TIMEOUT:
      HETZNER_TTL:
      HETZNER_HTTP_TIMEOUT:
      # linode
      LINODE_TOKEN:
      LINODE_POLLING_INTERVAL:
      LINODE_PROPAGATION_TIMEOUT:
      LINODE_TTL:
      LINODE_HTTP_TIMEOUT:
      # namecheap
      NAMECHEAP_API_KEY:
      NAMECHEAP_API_USER:
      NAMECHEAP_CLIENT_IP:
      NAMECHEAP_SANDBOX:
      NAMECHEAP_POLLING_INTERVAL:
      NAMECHEAP_PROPAGATION_TIMEOUT:
      NAMECHEAP_TTL:
      NAMECHEAP_HTTP_TIMEOUT:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - postern-mta-data:/var/lib/opendkim
      # Sole writer of the CF edge IP-range allowlists nginx consumes RO.
      - postern-edge:/var/lib/postern-edge
    networks: [default]
    init: true
    restart: "no"

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: docker-proxy
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - type: bind
        read_only: true
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    networks: [default]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    init: true
    restart: unless-stopped

networks:
  # name: aliased to the same node as services.portal.environment.SHADOWSOCKS_NETWORK
  # above -- see the x-shadowsocks-network comment at the top of this file.
  shadowsocks:
    name: *shadowsocks_network
    driver: bridge
  mta-submit:
    name: mta-submit
    internal: true
    ipam:
      config:
        - subnet: 172.30.42.0/29

volumes:
  postern-data:
    name: postern-data
  # CF edge IP-range allowlists: provisioner writes (rw sole-writer), nginx
  # reads (ro). Empty in non-edge deployments. See compose.edge.yaml + docs/deployment/edge.md.
  postern-edge:
    name: postern-edge
  postern-mta-data:
    name: postern-mta-data
  postern-mta-queue:
    name: postern-mta-queue
  # Auto-renewal cert volume; populated by the provisioner under compose.cert.yaml
  # and mounted on nginx + mta (both ro) and provisioner + portal (both rw, the
  # provisioner writes the cert files, the portal writes the .renew-cert trigger).
  # In BYO-certs mode this volume is unused; nginx and mta bind-mount /etc/letsencrypt.
  postern-letsencrypt:
    name: postern-letsencrypt
