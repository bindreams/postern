name: Complete subrepo pull for Renovate PRs

on:
  pull_request:
    paths:
      - "external/**/.gitrepo"

permissions:
  contents: write

jobs:
  subrepo-pull:
    # Only run on Renovate PRs that touched .gitrepo files
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # Needs a token that can push back to the PR branch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-subrepo
        run: |
          git clone --depth 1 https://github.com/ingydotnet/git-subrepo /tmp/git-subrepo
          echo "/tmp/git-subrepo/lib" >> "$GITHUB_PATH"
          echo "MANPATH=/tmp/git-subrepo/man:$MANPATH" >> "$GITHUB_ENV"

      # git-subrepo makes commits, and a runner has no committer identity.
      - name: Set git committer identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect changed subrepos and pull
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Both the changed-file list and the reset below read the merge base, so they see
          # the same .gitrepo: a base that moved on after the branch was cut counts for neither.
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          changed=$(git diff --name-only "$merge_base" HEAD -- 'external/*/.gitrepo')

          for gitrepo_file in $changed; do
            subrepo_dir=$(dirname "$gitrepo_file")
            # Extract the target branch/tag from the .gitrepo file
            target_branch=$(grep '^\s*branch = ' "$gitrepo_file" | sed 's/.*branch = //')

            echo "::group::Pulling $subrepo_dir at $target_branch"

            # Reset .gitrepo to the merge base so git-subrepo can do a clean pull
            git checkout "$merge_base" -- "$gitrepo_file"
            git commit -m "chore(external): reset $gitrepo_file for subrepo pull"

            # Pull the new version
            git subrepo pull "$subrepo_dir" -b "$target_branch" -m "chore(external): pull $subrepo_dir at $target_branch"

            echo "::endgroup::"
          done

      - name: Push updated source to PR branch
        run: git push
