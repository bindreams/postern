## E2E real-mode overlay for outbound delivery tests.
##
## Layered on top of e2e.compose.yaml (NOT e2e-mta.compose.yaml). Project name
## is `postern-e2e-mta-real`. This is the maintainer-only path: requires real
## DNS provider creds + a publicly-trusted TLS cert at /etc/letsencrypt/live/
## + unblocked outbound port 25 + a receivable test mailbox.
##
## Manual bring-up on a VPS:
##   export MTA_TEST_DOMAIN=mta-test.example.com
##   export MTA_TEST_ADMIN_EMAIL=admin@something-else.example.com
##   export MTA_TEST_DNS_PROVIDER=cloudflare
##   export CLOUDFLARE_API_TOKEN=...
##   export POSTERN_E2E_TLS_DIR=/etc/letsencrypt/live/${MTA_TEST_DOMAIN}
##   docker compose -p postern-e2e-mta-real \
##     -f portal/tests/e2e/e2e.compose.yaml \
##     -f portal/tests/e2e/e2e-mta-real.compose.yaml \
##     build
##   docker compose -p postern-e2e-mta-real -f ... -f ... up -d --wait
##
## Co-location: the VPS this runs on very likely already has a production
## stack. This overlay pins its own mta-submit subnet (10.234.44.0/29) --
## see test_compose_colocation.py -- but deliberately does NOT move its mta
## off host port 25. See CLAUDE.md's co-location invariant for why (sender-
## callout/MX reachability, and which side loses if both stacks come up at
## once) and issue #223 for a fully hermetic replacement.

services:
  mta:
    build:
      context: ../../..
      dockerfile: mta/Dockerfile
    image: local/postern-mta-test
    container_name: postern-e2e-mta-real-mta
    hostname: mail.${MTA_TEST_DOMAIN:?MTA_TEST_DOMAIN must be set for the real-mode overlay}
    environment:
      DOMAIN: ${MTA_TEST_DOMAIN}
      MTA_VERIFY_DNS: "true"
      MTA_REQUIRE_DNSSEC: ${MTA_TEST_REQUIRE_DNSSEC:-false}
      MTA_ADMIN_EMAIL: ${MTA_TEST_ADMIN_EMAIL:?MTA_TEST_ADMIN_EMAIL must be set}
      MTA_SUBMIT_CIDR: 10.234.44.0/29
      SMTP_FROM: noreply@${MTA_TEST_DOMAIN}
      # NO MTA_E2E_TRANSPORT_OVERRIDE -- delivery uses real DNS + real outbound 25.
      # No DNS provider credentials: the mta reads none (only the provisioner does).
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE, SYS_CHROOT]
    security_opt: ["no-new-privileges:true"]
    # Host port 25, all interfaces -- deliberately NOT loopback-bound. See the
    # file header for why (sender-callout/MX reachability, and the ordering
    # caveat) and test_compose_colocation.py's allowlisted exception for this
    # entry.
    ports:
      - "25:25/tcp"
    volumes:
      - postern-mta-data:/var/lib/opendkim
      - postern-mta-queue:/var/spool/postfix
      # Real-mode requires a real Let's Encrypt cert chain at this path.
      # POSTERN_E2E_TLS_DIR should point at the maintainer's `live/<domain>/`
      # directory (or a copy of it).
      - type: bind
        read_only: true
        source: ${POSTERN_E2E_TLS_DIR:?POSTERN_E2E_TLS_DIR must be set for the real-mode overlay}
        target: /etc/letsencrypt/live/${MTA_TEST_DOMAIN}
      - type: bind
        read_only: true
        source: ${POSTERN_E2E_TLS_DIR}
        target: /etc/letsencrypt/live/mail.${MTA_TEST_DOMAIN}
    # Mirror production: alias `mta-submit` on the internal network so the portal
    # submits from a mynetworks source (issue #151). See compose.yaml.
    networks:
      default:
      mta-submit:
        aliases: [mta-submit]
    depends_on:
      provisioner:
        condition: service_started
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - |
          import socket
          for p in (25, 587):
              s = socket.create_connection(("127.0.0.1", p), 3)
              s.close()
      interval: 5s
      timeout: 5s
      retries: 36  # ~3 minutes; provisioner may need to publish DNS first
    init: true

  provisioner:
    build:
      context: ../../..
      dockerfile: provisioner/Dockerfile
    image: local/postern-provisioner-test
    container_name: postern-e2e-mta-real-provisioner
    user: "110:110"
    environment:
      DOMAIN: ${MTA_TEST_DOMAIN}
      DNS_PROVIDER: ${MTA_TEST_DNS_PROVIDER:?MTA_TEST_DNS_PROVIDER must be set for the real-mode overlay}
      MTA_DKIM_SELECTOR_PREFIX: s
      # The provider variables compose.yaml's provisioner receives (see there).
      # cloudflare
      CLOUDFLARE_API_TOKEN:
      CF_API_EMAIL:
      CF_API_KEY:
      CF_DNS_API_TOKEN:
      CF_ZONE_API_TOKEN:
      CLOUDFLARE_EMAIL:
      CLOUDFLARE_API_KEY:
      CLOUDFLARE_DNS_API_TOKEN:
      CLOUDFLARE_ZONE_API_TOKEN:
      CLOUDFLARE_BASE_URL:
      CLOUDFLARE_POLLING_INTERVAL:
      CLOUDFLARE_PROPAGATION_TIMEOUT:
      CLOUDFLARE_TTL:
      CLOUDFLARE_HTTP_TIMEOUT:
      # route53
      AWS_REGION:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      AWS_HOSTED_ZONE_ID:
      AWS_ASSUME_ROLE_ARN:
      AWS_EXTERNAL_ID:
      AWS_WAIT_FOR_RECORD_SETS_CHANGED:
      AWS_PRIVATE_ZONE:
      AWS_MAX_RETRIES:
      AWS_POLLING_INTERVAL:
      AWS_PROPAGATION_TIMEOUT:
      AWS_TTL:
      # gandi
      GANDI_API_TOKEN:
      GANDIV5_PERSONAL_ACCESS_TOKEN:
      GANDIV5_API_KEY:
      GANDIV5_POLLING_INTERVAL:
      GANDIV5_PROPAGATION_TIMEOUT:
      GANDIV5_TTL:
      GANDIV5_HTTP_TIMEOUT:
      # digitalocean
      DO_AUTH_TOKEN:
      DO_API_URL:
      DO_POLLING_INTERVAL:
      DO_PROPAGATION_TIMEOUT:
      DO_TTL:
      DO_HTTP_TIMEOUT:
      # ovh
      OVH_ENDPOINT:
      OVH_APPLICATION_KEY:
      OVH_APPLICATION_SECRET:
      OVH_CONSUMER_KEY:
      OVH_CLIENT_ID:
      OVH_CLIENT_SECRET:
      OVH_ACCESS_TOKEN:
      OVH_POLLING_INTERVAL:
      OVH_PROPAGATION_TIMEOUT:
      OVH_TTL:
      OVH_HTTP_TIMEOUT:
      # hetzner
      HETZNER_API_TOKEN:
      HETZNER_POLLING_INTERVAL:
      HETZNER_PROPAGATION_TIMEOUT:
      HETZNER_TTL:
      HETZNER_HTTP_TIMEOUT:
      # linode
      LINODE_TOKEN:
      LINODE_POLLING_INTERVAL:
      LINODE_PROPAGATION_TIMEOUT:
      LINODE_TTL:
      LINODE_HTTP_TIMEOUT:
      # namecheap
      NAMECHEAP_API_KEY:
      NAMECHEAP_API_USER:
      NAMECHEAP_CLIENT_IP:
      NAMECHEAP_SANDBOX:
      NAMECHEAP_POLLING_INTERVAL:
      NAMECHEAP_PROPAGATION_TIMEOUT:
      NAMECHEAP_TTL:
      NAMECHEAP_HTTP_TIMEOUT:
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - postern-mta-data:/var/lib/opendkim
    networks: [default]
    init: true
    restart: unless-stopped  # NOT "no" -- the rotation loop runs continuously here

  portal:
    environment:
      SMTP_HOST: mta-submit
      SMTP_PORT: "587"
      SMTP_FROM: noreply@${MTA_TEST_DOMAIN}
      DOMAIN: ${MTA_TEST_DOMAIN}
      # Restated from e2e.compose.yaml's portal block: this guard checks each
      # file's own text and does not assume it is always layered onto the
      # base file. Redundant, not conflicting, when it is.
      SHADOWSOCKS_IMAGE: local/shadowsocks-server-test
      # This file renames networks.e2e-shadowsocks.name below to
      # e2e-shadowsocks-mta-real; without restating this, the portal would
      # inherit e2e.compose.yaml's literal "e2e-shadowsocks", a network no
      # service in this project joins.
      SHADOWSOCKS_NETWORK: e2e-shadowsocks-mta-real
    volumes:
      - postern-mta-data:/var/lib/opendkim:ro
    networks: [default, mta-submit]
    depends_on:
      docker-proxy:
        condition: service_healthy
      mta:
        condition: service_healthy

networks:
  default:
    name: postern-e2e-mta-real-default
    # NOT inside Docker's default dynamic-allocation pool -- mirrors the
    # e2e-mta default network fix. See the co-location invariant in CLAUDE.md.
    ipam:
      config:
        - subnet: 10.234.46.0/24
  e2e-tunnel-entry:
    name: e2e-tunnel-entry-mta-real
  e2e-shadowsocks:
    name: e2e-shadowsocks-mta-real
  mta-submit:
    name: mta-submit-mta-real
    internal: true
    # Distinct from BOTH production's 172.30.42.0/29 and e2e-mta's
    # 10.234.43.0/29. Must equal MTA_SUBMIT_CIDR above.
    ipam:
      config:
        - subnet: 10.234.44.0/29

volumes:
  postern-e2e-data:
    name: postern-e2e-mta-real-portal-data
  postern-mta-data:
    name: postern-e2e-mta-real-dkim-data
  postern-mta-queue:
    name: postern-e2e-mta-real-postfix-queue
