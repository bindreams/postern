# Unit-test harness: HAProxy loads the test script, which runs every case in register_init and exits 0 (all
# passed) or 3 (a failure). Run through portal/tests/test_docker_proxy_policy.py, in the pinned base image.
global
    tune.lua.bool-sample-conversion normal
    lua-load /pn/tests/test_policy.lua

defaults
    mode http
    timeout client 1s
    timeout server 1s
    timeout connect 1s

frontend harness
    bind 127.0.0.1:2375
