# The Docker API allow-list. Requests arrive on a unix socket in a volume that only the portal mounts, are judged by
# policy.lua (through action.lua), and are forwarded to the real docker.sock only if allowed. Default deny.

global
    setenv POSTERN_DOCKER_SOCKET /var/run/docker.sock
    # `var(...) -m bool` must test the Lua boolean as a boolean.
    tune.lua.bool-sample-conversion normal
    lua-load /etc/postern-proxy/action.lua
    user root
    chroot /

defaults
    mode http
    # The Lua action reads the create body; HAProxy buffers it first.
    option http-buffer-request
    # Failure bounds on external peers, not synchronization. `stop` waits up to its timeout, hence the long server side.
    timeout http-request 10s
    timeout client 10m
    timeout server 10m
    timeout connect 10s

backend docker
    server socket "${POSTERN_DOCKER_SOCKET}"

# Everything the portal sends. `proto h1`: HTTP/2 prior knowledge would otherwise be accepted on this bind.
frontend proxy
    bind unix@/run/docker-api/docker.sock mode 660 uid 65532 gid 65532 proto h1
    http-request lua.pn_filter
    # A Lua runtime error does NOT deny by itself (measured): only the variable, set as the action's last statement,
    # lets a request through. Pinned by tests/test_compose_docker_proxy.py.
    http-request deny deny_status 403 unless { var(txn.pn_allow) -m bool }
    default_backend docker

# The container healthcheck: reachable only inside the proxy's own (empty) network namespace.
frontend health
    bind 127.0.0.1:2376 proto h1
    http-request deny deny_status 403 unless METH_GET { path /_ping }
    default_backend docker
