# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

exclude = "^external/"
default_install_hook_types = ["pre-commit", "commit-msg"]

# Local hooks ==========================================================================================================
[[repos]]
repo = "local"

[[repos.hooks]]
id = "format-section-comments"
name = "format section comments"
entry = "python scripts/format-section-comments.py"
language = "python"
types_or = ["rust", "python", "toml", "javascript", "ts", "jsx", "tsx", "dockerfile"]

[[repos.hooks]]
id = "ty"
name = "ty check"
# `--directory portal` (not `--project portal`) is load-bearing: ty reads
# `[tool.ty.rules]` from the `pyproject.toml` in its CWD, and those rules live
# in portal/pyproject.toml. With only `--project`, CWD stays at the repo root
# and the ignore rules are silently dropped.
#
# The trailing `../scripts` is deliberate, not the default "the project
# root": every tracked first-party script under scripts/ (ci_lint_lib.py,
# format-section-comments.py, verify-deploy.py, ...) lives outside the portal
# project ty would otherwise scan, and `[tool.ty.environment] extra-paths` in
# portal/pyproject.toml only makes ci_lint_lib *importable* from portal/tests
# -- it does not add any of these modules as a check target, so a bug
# entirely inside one of their own bodies would pass silently without this
# explicit path. The whole directory, not just ci_lint_lib.py: a single named
# file would leave every OTHER script in scripts/ unchecked despite the claim
# (CLAUDE.md) that this is the only place CI type-checks.
entry = "uv run --directory portal --group dev ty check . ../scripts"
language = "python"
types = ["python"]
pass_filenames = false

# External hooks =======================================================================================================
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.10.0.1"
# SC2310/SC2311: `set -e` does not apply inside a function called in a
# condition or a command substitution -- the failure mode scripts/deploy.sh
# guards by hand with `shopt -s inherit_errexit`.
hooks = [{ id = "shellcheck", args = ["--enable=check-set-e-suppressed"] }]

[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker.python"
rev = "3.2.1"
hooks = [
  { id = "editorconfig-checker", exclude_types = ["rust", "markdown", "python"] },
]

[[repos]]
repo = "https://github.com/google/yapf"
rev = "v0.43.0"
hooks = [{ id = "yapf" }]

# Two mdformat entries with separate plugin envs: mdformat-gfm escapes MyST
# syntax (toctree titles, colon fences), so docs/ gets the myst plugin instead.
[[repos]]
repo = "https://github.com/hukkin/mdformat"
rev = "1.0.0"
hooks = [
  { id = "mdformat", additional_dependencies = ["mdformat-gfm==1.0.0"], exclude = "^docs/" },
  { id = "mdformat", name = "mdformat (myst)", additional_dependencies = ["mdformat-myst==0.3.0"], files = "^docs/" },
]
