name: Complete subrepo pull for Renovate PRs

on:
  pull_request:
    paths:
      - "external/**/.gitrepo"

permissions:
  contents: read

jobs:
  subrepo-pull:
    # Renovate PRs that touched .gitrepo files; not the push this job makes itself.
    if: startsWith(github.head_ref, 'renovate/') && github.actor != 'nathan-blahaj[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: subrepo-pull-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      # A GITHUB_TOKEN push does not trigger workflows, so the PR's checks would never run on the pulled source and
      # Renovate could not automerge it. The nathan-blahaj app's token does.
      - name: Mint nathan-blahaj token
        id: nathan
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NATHAN_APP_ID }}
          private-key: ${{ secrets.NATHAN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ steps.nathan.outputs.token }}

      - name: Install git-subrepo
        run: |
          git clone --depth 1 https://github.com/ingydotnet/git-subrepo /tmp/git-subrepo
          echo "/tmp/git-subrepo/lib" >> "$GITHUB_PATH"
          echo "MANPATH=/tmp/git-subrepo/man:$MANPATH" >> "$GITHUB_ENV"

      # git-subrepo commits; a runner has no identity. Renovate's gitIgnoredAuthors lists this email, so it keeps
      # rebasing and automerging the branch.
      - name: Set git committer identity
        run: |
          git config user.name "nathan-blahaj[bot]"
          git config user.email "nathan-blahaj[bot]@users.noreply.github.com"

      - name: Detect changed subrepos and pull
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # git-subrepo refuses a detached HEAD; the branch starts at the commit the checkout pinned.
          git switch -c "$HEAD_REF"

          # Diff and reset both use the merge base, so a base that moved on after the branch was cut counts for neither.
          merge_base=$(git merge-base "$BASE_SHA" HEAD)
          changed=$(git diff --name-only "$merge_base" HEAD -- 'external/*/.gitrepo')

          for gitrepo_file in $changed; do
            subrepo_dir=$(dirname "$gitrepo_file")
            # Extract the target branch/tag from the .gitrepo file
            target_branch=$(grep '^\s*branch = ' "$gitrepo_file" | sed 's/.*branch = //')

            echo "::group::Pulling $subrepo_dir at $target_branch"

            # Reset .gitrepo to the merge base so git-subrepo can do a clean pull
            git checkout "$merge_base" -- "$gitrepo_file"
            git commit -m "chore(external): reset $gitrepo_file for subrepo pull"

            # Pull the new version
            git subrepo pull "$subrepo_dir" -b "$target_branch" -u -m "chore(external): pull $subrepo_dir at $target_branch"

            echo "::endgroup::"
          done

      # Fails, rather than overwrites, if the branch moved since the checkout.
      - name: Push updated source to PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git push origin "HEAD:refs/heads/${HEAD_REF}"
